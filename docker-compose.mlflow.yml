services:
  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - mlflow-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-06-29T01-20-47Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 1; done;
      mc mb -p local/mlflow-artifacts || true;
      mc anonymous set none local/mlflow-artifacts || true;
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    depends_on:
      - minio-create-bucket
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - mlflow-backend-store:/mlflow
    ports:
      - "5000:5000"
    command: >
      /bin/sh -c "
      pip install --no-cache-dir boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow-artifacts
      "

volumes:
  mlflow-minio-data:
  mlflow-backend-store:
