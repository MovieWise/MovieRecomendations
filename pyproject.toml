[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-recs"
version = "0.1.0"
description = "Production-ready ML core for the MovieRecomendations project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
hybrid = [
  "lightgbm>=4.0",
  "catboost>=1.2",
  "optuna>=3.6",
]
observability = [
  "mlflow>=2.12",
  "boto3>=1.34",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
]
deep = [
  "torch>=2.2",
  "sentence-transformers>=2.7",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
